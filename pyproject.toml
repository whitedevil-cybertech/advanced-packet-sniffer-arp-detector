[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apsad"
version = "0.1.0"
description = "Advanced Packet Sniffer with ARP Spoofing Detection (defensive monitoring tool)"
requires-python = ">=3.10"
dependencies = [
  "scapy>=2.5.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]